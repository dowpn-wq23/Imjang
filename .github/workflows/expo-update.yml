# 아이폰 앱(mobile/)을 Expo 클라우드(EAS Update)에 올립니다.
# 한 번 설정: expo.dev 계정 → Access token 발급 → 이 저장소 Settings → Secrets → Actions 에 EXPO_TOKEN 으로 등록
# 이후 main 에 올라오는 변경은 자동으로 업로드되고, 아이폰 Expo Go 에서 최신 버전으로 열립니다.
name: Expo 앱 업로드

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/**', 'core/**', '.github/workflows/expo-update.yml']
  workflow_dispatch:

concurrency:
  group: expo-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS: npx --yes eas-cli@24.12.1
    steps:
      - name: EXPO_TOKEN 확인
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 EXPO_TOKEN 을 등록하세요."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 패키지 설치
        run: npm ci --no-audit --no-fund

      - name: 지도 화면·데이터 조회 코드를 앱에 넣기
        run: npm run bundle-web

      - name: Expo 프로젝트 연결 (없으면 만들기)
        run: $EAS init --non-interactive --force

      - name: EAS Update 설정
        run: $EAS update:configure --platform ios --environment production --non-interactive

      - name: 업로드
        run: |
          MSG="$(git log -1 --pretty=%s | cut -c1-100)"
          $EAS update --channel main --platform ios --environment production --message "$MSG" --json --non-interactive > update.json
          cat update.json

      - name: 아이폰에서 여는 링크
        run: |
          ACCOUNT="$($EAS whoami | head -1 | cut -d" " -f1)"
          node -e '
            const fs = require("fs");
            const app = require("./app.json").expo;
            const u = JSON.parse(fs.readFileSync("update.json", "utf8"))[0];
            const pid = app.extra.eas.projectId;
            const lines = [
              "## 임장지도 앱 업로드 완료",
              "",
              "아이폰에 **Expo Go**를 설치한 뒤, 아이폰에서 아래 링크를 누르면 앱이 열립니다. (항상 최신 버전)",
              "",
              "- 아이폰에서 열기: `exp://u.expo.dev/" + pid + "?channel-name=main`",
              "- QR·상세: https://expo.dev/accounts/" + process.argv[1] + "/projects/" + app.slug + "/updates/" + u.group,
              "",
              "런타임 " + u.runtimeVersion + " · 업데이트 " + u.id,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          ' "$ACCOUNT"
