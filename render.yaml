# Render 무료 클라우드 배포 설정 — render.com → New → Blueprint → 이 저장소 선택
# 배포 화면에서 아래 sync:false 항목(API 키)을 입력합니다. 키는 저장소에 올라가지 않습니다.
services:
  - type: web
    name: imjang-map
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NAVER_MAP_KEY_ID
        sync: false
      - key: VWORLD_KEY
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      # 서버에서 VWorld를 부를 때는 이 값만 확인하므로, PC용으로 등록한 주소를 그대로 씀 (VWorld 사이트 설정 변경 불필요)
      - key: VWORLD_DOMAIN
        value: http://localhost:3000
      - key: NAVER_LAND_ENABLED
        value: "true"
