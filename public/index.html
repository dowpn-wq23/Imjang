<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>임장지도</title>
  <!-- 아이폰 사파리 → 공유 → "홈 화면에 추가"로 앱처럼 설치 -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="임장지도">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#18214A">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <form class="search" role="search" autocomplete="off">
      <input id="search-input" type="search" placeholder="아파트 검색" enterkeyhint="search" aria-label="아파트 이름 검색"
        aria-autocomplete="list" aria-controls="search-list" autocapitalize="off" spellcheck="false">
    </form>
    <nav class="mode-tabs" role="tablist">
      <button data-mode="apt" class="active" role="tab">아파트</button>
      <button data-mode="land" role="tab">상가·토지</button>
    </nav>
    <button class="app-only app-settings" data-native="settings" aria-label="앱 설정">⚙</button>
  </header>

  <ul id="search-list" class="search-list hidden" role="listbox" aria-label="검색 추천"></ul>

  <div id="map"></div>

  <div class="tools" role="toolbar">
    <button data-tool="info" class="active">정보</button>
    <button data-tool="slope">경사도</button>
    <button data-tool="street">거리뷰</button>
    <div class="sep"></div>
    <button id="btn-cadastral">지적도</button>
    <button id="btn-locate">내 위치</button>
  </div>

  <!-- 지도 종류 (네이버 기본 버튼은 휴대폰에서 상단 바와 겹쳐서 직접 만듦) -->
  <div class="maptype" role="group" aria-label="지도 종류">
    <button data-maptype="NORMAL">일반</button>
    <button data-maptype="HYBRID" class="active">위성</button>
    <button data-maptype="TERRAIN">지형</button>
  </div>

  <div id="hint" class="hint"></div>

  <aside id="panel" class="panel hidden">
    <button class="panel-grip" aria-label="패널 크기 전환"></button>
    <button class="panel-close" aria-label="닫기">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="pano-wrap" class="pano hidden">
    <div id="pano"></div>
    <button class="pano-close">닫기 ×</button>
    <div id="pano-msg" class="pano-msg hidden">이 위치에는 거리뷰가 없습니다. 지도의 파란 선 위를 눌러보세요.</div>
  </div>

  <div id="fatal" class="fatal hidden"></div>

  <div id="install-tip" class="install-tip hidden" role="note">
    <span>사파리 아래쪽 <b>공유</b> 버튼 → <b>홈 화면에 추가</b>를 누르면 앱처럼 설치됩니다.</span>
    <button class="install-tip-close" aria-label="닫기">×</button>
  </div>

  <script src="/config.js"></script>
  <script src="app.js"></script>
</body>
</html>
